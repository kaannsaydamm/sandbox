name: Render documentary TTS

on:
  push:
    branches:
      - chatgpt/turkiye-israil-video
    paths:
      - 'tts_manifest.json'
      - 'scripts/render_tts.mjs'
      - '.github/workflows/render-doc-tts.yml'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/turkiye-israil-video
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Render Turkish neural narration
        run: node scripts/render_tts.mjs
      - name: Pack narration
        run: zip -j tts_out.zip tts_out/*.mp3
      - name: Commit rendered audio to scratch branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tts_out/*.mp3 tts_out.zip
          git diff --cached --quiet && exit 0
          git commit -m 'build: render documentary neural narration'
          git push origin HEAD:chatgpt/turkiye-israil-video
